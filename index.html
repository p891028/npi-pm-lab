<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NPI PM Lab</title>

  <style>
    body {
      margin: 0;
      background: #0d1117;
      color: #e6edf3;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 900px;
      max-width: 90%;
      margin: 80px auto;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #8b949e;
      font-size: 20px;
      margin-bottom: 50px;
    }

    .mission {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 30px;
    }

    .mission h2 {
      margin-top: 0;
    }

    .data {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 25px;
    }

    .item {
      background: #21262d;
      padding: 15px;
      border-radius: 8px;
    }

    button {
      background: #238636;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #2ea043;
    }

    #result {
      margin-top: 30px;
      font-size: 22px;
    }
  </style>
</head>


<body>

<div class="container">

  <h1>NPI PM LAB</h1>

  <div class="subtitle">
    ODM New Product Introduction Simulation
  </div>


  <div class="mission">

    <h2>PROJECT 01 — Medical Device Mainboard</h2>

    <p>
      客戶要求 16 週後進入 MP。
      目前產品規格尚未完全 Freeze。
    </p>


    <div class="data">

      <div class="item">
        MP Target<br>
        <strong>16 Weeks</strong>
      </div>

      <div class="item">
        Spec Complete<br>
        <strong>82%</strong>
      </div>

      <div class="item">
        EVT Quantity<br>
        <strong>30 pcs</strong>
      </div>

      <div class="item">
        Long Lead Time<br>
        <strong>14 Weeks</strong>
      </div>

    </div>

  </div>


  <button onclick="startGame()">
    START PROJECT
  </button>


  <div id="result"></div>

</div>


<script>

function startGame() {

  document.getElementById("result").innerHTML =
    "WEEK 0 — Project Kickoff started.";

}

</script>


</body>
</html>
