<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NPI PM Lab</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0d1117;
  color: #e6edf3;
  font-family: Arial, "Microsoft JhengHei", sans-serif;
}

header {
  border-bottom: 1px solid #30363d;
  padding: 18px 24px;
}

header h1 {
  margin: 0;
  font-size: 21px;
}

header p {
  margin: 6px 0 0;
  color: #8b949e;
  font-size: 13px;
}

.container {
  max-width: 920px;
  margin: 0 auto;
  padding: 28px 20px 60px;
}

.project-card {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 10px;
  padding: 22px;
  margin-bottom: 22px;
}

.project-card h2 {
  margin: 0 0 12px;
  font-size: 17px;
}

.project-card p {
  margin: 7px 0;
  color: #c9d1d9;
  line-height: 1.6;
}

.progress {
  display: flex;
  gap: 6px;
  margin-bottom: 25px;
}

.progress div {
  height: 5px;
  flex: 1;
  background: #30363d;
  border-radius: 10px;
}

.progress div.active {
  background: #2f81f7;
}

.stage {
  color: #58a6ff;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: .5px;
  margin-bottom: 8px;
}

.question {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 10px;
  overflow: hidden;
}

.question-header {
  padding: 22px 24px 18px;
  border-bottom: 1px solid #30363d;
}

.question-header h2 {
  margin: 0 0 12px;
  font-size: 21px;
}

.situation {
  color: #c9d1d9;
  line-height: 1.65;
  margin-bottom: 18px;
}

.prompt {
  font-weight: bold;
  line-height: 1.6;
}

.options {
  padding: 8px 0;
}

.option {
  display: flex;
  align-items: flex-start;
  gap: 13px;
  padding: 14px 24px;
  cursor: pointer;
  border-bottom: 1px solid #21262d;
  line-height: 1.45;
}

.option:last-child {
  border-bottom: none;
}

.option:hover {
  background: #1c2128;
}

.option input {
  margin-top: 3px;
  width: 17px;
  height: 17px;
  accent-color: #2f81f7;
}

.option-en {
  color: #e6edf3;
}

.option-zh {
  color: #8b949e;
  margin-top: 3px;
  font-size: 14px;
}

.actions {
  padding: 20px 24px;
  border-top: 1px solid #30363d;
  display: flex;
  justify-content: flex-end;
}

button {
  border: 0;
  border-radius: 6px;
  padding: 11px 24px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.confirm-btn {
  background: #238636;
  color: white;
}

.confirm-btn:hover {
  background: #2ea043;
}

.next-btn {
  background: #1f6feb;
  color: white;
}

.next-btn:hover {
  background: #388bfd;
}

.message {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 10px;
  padding: 28px;
  text-align: center;
}

.message h2 {
  margin-top: 0;
}

.message p {
  color: #8b949e;
  line-height: 1.6;
}

.hidden {
  display: none;
}

.decision-note {
  color: #8b949e;
  font-size: 13px;
  margin-top: 14px;
}

.footer {
  color: #484f58;
  text-align: center;
  margin-top: 30px;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <h1>NPI PM LAB</h1>
  <p>Medical Device Host Customization — DVT Project</p>
</header>

<div class="container">

  <div class="project-card" id="intro">
    <h2>Project Background / 專案背景</h2>

    <p>
      Medical device project based on an existing standard motherboard
      with customization.
    </p>

    <p>
      醫療專案，以現成標準主機板進行客製改版。
    </p>

    <p>
      <strong>The project starts from DVT.</strong><br>
      <strong>專案從 DVT 階段開始。</strong>
    </p>
  </div>

  <div class="progress" id="progress"></div>

  <div id="game"></div>

  <div class="footer">
    NPI PM Lab — Decision Simulation
  </div>

</div>

<script>

const stages = [

{
  stage: "WEEK 0 — PROJECT KICKOFF",
  title: "HW Schematic Started / HW 線路設計開始",
  situation: `
    HW schematic design has started.<br>
    HW 線路設計已開始。
  `,
  prompt: `
    Which actions would you take?<br>
    你會採取哪些行動？
  `,
  options: [
    ["Request PCB Stack-up", "請 PCB 廠準備 Stack-up"],
    ["Check PCB Material Availability", "確認 PCB 板材供應狀況"],
    ["Reserve Layout Resource", "預約 Layout 資源"],
    ["Start Special Fan Development", "啟動特殊風扇開發"],
    ["Order PV VRTT Fixture", "採購 PV VRTT 治具"],
    ["Reserve Validation Resources", "預排驗證資源"],
    ["Request Test Cable Samples", "申請測試線材樣品"],
    ["Start Packaging Design", "啟動包材設計"],
    ["Prepare Customs Documentation", "準備報關文件"]
  ]
},

{
  stage: "HW DESIGN UPDATE",
  title: "Schematic Complete / 線路設計完成",
  situation: `
    HW schematic is complete. Layout can start.<br>
    HW 線路設計完成，可以開始 Layout。<br><br>

    PCB vendor reports that the specified PCB material
    is currently not in stock.<br>
    PCB 廠回覆指定板材目前沒有現料。
  `,
  prompt: `
    Which actions would you take?<br>
    你會採取哪些行動？
  `,
  options: [
    ["Release Layout", "啟動 Layout"],
    ["Ask PCB vendor to prepare the specified material", "請 PCB 廠準備指定板材"],
    ["Ask EE to evaluate available alternative material", "請 EE 評估可取得的替代板材"],
    ["Wait until Layout is completed before confirming PCB material", "等 Layout 完成後再確認板材"],
    ["Update the DVT schedule", "更新 DVT 時程"],
    ["Reconfirm validation resource timing", "重新確認驗證資源時程"]
  ]
},

{
  stage: "LAYOUT UPDATE",
  title: "Major Component Placement Ready / 大型元件定位完成",
  situation: `
    Major component placement is complete.
    Routing is about to start.<br>
    大型元件 Placement 已完成，即將開始 Routing。
  `,
  prompt: `
    Which actions would you take?<br>
    你會採取哪些行動？
  `,
  options: [
    ["Continue Routing", "繼續 Routing"],
    ["Send Placement and schematic to customer", "將 Placement 與線路提供客戶確認"],
    ["Ask ME to review the current placement", "請 ME 確認目前 Placement"],
    ["Request test cable samples", "申請測試線材樣品"],
    ["Start packaging design", "啟動包材設計"],
    ["Update the DVT schedule", "更新 DVT 時程"]
  ]
},

{
  stage: "CUSTOMER REVIEW",
  title: "Customer Review Pending / 客戶確認中",
  situation: `
    Customer review is still pending.
    Layout resource is available.<br>
    客戶仍在確認中，目前 Layout 資源可使用。
  `,
  prompt: `
    Which actions would you take?<br>
    你會採取哪些行動？
  `,
  options: [
    ["Continue Routing", "繼續 Routing"],
    ["Continue only the unaffected areas", "僅繼續不受影響的區域"],
    ["Hold Routing", "暫停 Routing"],
    ["Follow up with the customer", "向客戶追蹤確認"],
    ["Delay the Layout schedule by one week", "Layout 時程延後一週"],
    ["Update downstream schedules", "更新後續時程"]
  ]
},

{
  stage: "CUSTOMER FEEDBACK",
  title: "Design Change / 設計變更",
  situation: `
    Customer requests a change to the LAN connector position
    and the adjacent I/O connector.<br>
    客戶要求變更 LAN Connector 及相鄰 I/O Connector 位置。
  `,
  prompt: `
    Which actions would you take?<br>
    你會採取哪些行動？
  `,
  options: [
    ["Update the affected Layout", "修改受影響的 Layout"],
    ["Review the impact on completed Routing", "確認已完成 Routing 的影響"],
    ["Review the mechanical impact", "確認機構影響"],
    ["Review SI-related impact", "確認 SI 相關影響"],
    ["Reconfirm test cable requirements", "重新確認測試線材需求"],
    ["Reconfirm packaging requirements", "重新確認包材需求"],
    ["Keep the original DVT schedule", "維持原 DVT 時程"],
    ["Update the DVT schedule", "更新 DVT 時程"]
  ]
},

{
  stage: "LAYOUT NEAR COMPLETION",
  title: "Layout Release Approaching / Layout 即將 Release",
  situation: `
    Layout is expected to be released shortly.<br>
    Layout 即將 Release。
  `,
  prompt: `
    Which actions would you take?<br>
    你會採取哪些行動？
  `,
  options: [
    ["Request test cable samples", "申請測試線材樣品"],
    ["Start packaging design", "啟動包材設計"],
    ["Confirm accessory requirements", "確認附件需求"],
    ["Reconfirm PCB production schedule", "重新確認 PCB 生產時程"],
    ["Reconfirm DVT build schedule", "重新確認 DVT 生產時程"],
    ["Reconfirm validation resource timing", "重新確認驗證資源時程"],
    ["Prepare customs documentation", "準備報關文件"],
    ["Start EMC", "啟動 EMC"]
  ]
},

{
  stage: "DVT PRODUCTION",
  title: "First DVT Board Available / DVT 首板產出",
  situation: `
    The first DVT board is available.
    The remaining units are still in production.<br>
    DVT 首板已產出，其餘數量仍在生產中。
  `,
  prompt: `
    Which actions would you take?<br>
    你會採取哪些行動？
  `,
  options: [
    ["Check the first board status", "確認首板狀態"],
    ["Request physical product photos", "取得實體產品照片"],
    ["Confirm remaining production schedule", "確認剩餘生產時程"],
    ["Prepare shipment documents", "準備出貨文件"],
    ["Confirm logistics arrangement", "確認物流安排"],
    ["Wait for the complete DVT lot", "等待整批 DVT 完成"],
    ["Reconfirm validation schedule", "重新確認驗證時程"]
  ]
},

{
  stage: "DVT READY",
  title: "DVT Units Ready / DVT 樣機完成",
  situation: `
    DVT units are ready.<br>
    DVT 樣機已完成。
  `,
  prompt: `
    Which actions would you take?<br>
    你會採取哪些行動？
  `,
  options: [
    ["Start PV", "啟動 PV"],
    ["Start SI", "啟動 SI"],
    ["Start THERMAL", "啟動 THERMAL"],
    ["Start EMC I/O Pre-scan", "啟動 EMC I/O Pre-scan"],
    ["Start DQA", "啟動 DQA"],
    ["Start QA Lab", "啟動 QA Lab"],
    ["Reconfirm validation resources", "重新確認驗證資源"],
    ["Arrange customer samples", "安排客戶樣品"]
  ]
}

];

let currentStage = 0;
let decisions = [];

function createProgress() {

  const progress = document.getElementById("progress");
  progress.innerHTML = "";

  stages.forEach((_, index) => {

    const bar = document.createElement("div");

    if (index <= currentStage) {
      bar.classList.add("active");
    }

    progress.appendChild(bar);

  });

}

function renderStage() {

  createProgress();

  const game = document.getElementById("game");
  const data = stages[currentStage];

  let optionsHTML = "";

  data.options.forEach((option, index) => {

    optionsHTML += `
      <label class="option">
        <input
          type="checkbox"
          name="decision"
          value="${index}"
        >

        <div>
          <div class="option-en">
            ${option[0]}
          </div>

          <div class="option-zh">
            ${option[1]}
          </div>
        </div>
      </label>
    `;

  });

  game.innerHTML = `
    <div class="question">

      <div class="question-header">

        <div class="stage">
          ${data.stage}
        </div>

        <h2>
          ${data.title}
        </h2>

        <div class="situation">
          ${data.situation}
        </div>

        <div class="prompt">
          ${data.prompt}
        </div>

        <div class="decision-note">
          Select all that apply / 可複選
        </div>

      </div>

      <div class="options">
        ${optionsHTML}
      </div>

      <div class="actions">
        <button
          class="confirm-btn"
          onclick="confirmDecision()"
        >
          CONFIRM / 確認
        </button>
      </div>

    </div>
  `;

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}

function confirmDecision() {

  const checked =
    [...document.querySelectorAll(
      'input[name="decision"]:checked'
    )];

  const selected =
    checked.map(input =>
      stages[currentStage].options[
        Number(input.value)
      ]
    );

  decisions.push({
    stage: stages[currentStage].stage,
    selected: selected
  });

  showTransition();

}

function showTransition() {

  const game = document.getElementById("game");

  if (currentStage >= stages.length - 1) {

    game.innerHTML = `
      <div class="message">

        <h2>
          DVT Decision Round Complete
        </h2>

        <p>
          DVT 階段決策已完成。
        </p>

        <p>
          Your decisions have been recorded.<br>
          系統已記錄本輪所有決策。
        </p>

        <button
          class="next-btn"
          onclick="restartGame()"
        >
          RESTART / 重新開始
        </button>

      </div>
    `;

    return;

  }

  game.innerHTML = `
    <div class="message">

      <h2>
        Decision Recorded
      </h2>

      <p>
        決策已記錄。
      </p>

      <button
        class="next-btn"
        onclick="nextStage()"
      >
        CONTINUE / 繼續
      </button>

    </div>
  `;

}

function nextStage() {

  currentStage++;
  renderStage();

}

function restartGame() {

  currentStage = 0;
  decisions = [];
  renderStage();

}

renderStage();

</script>

</body>
</html>
